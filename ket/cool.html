<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Animation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Set canvas to full window size
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Particle class
    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 5 + 1;
        this.baseX = x;
        this.baseY = y;
        this.density = (Math.random() * 30) + 1;
      }

      draw() {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      }

      repel(point) {
        const dx = point.x - this.x;
        const dy = point.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 100) {
          const forceDirectionX = dx / distance;
          const forceDirectionY = dy / distance;
          const force = (100 - distance) / 100;
          this.x -= forceDirectionX * force * this.density;
          this.y -= forceDirectionY * force * this.density;
        }
      }

      returnToBase() {
        if (this.x !== this.baseX) {
          this.x += (this.baseX - this.x) / 10;
        }
        if (this.y !== this.baseY) {
          this.y += (this.baseY - this.y) / 10;
        }
      }
    }

    // Create particles
    let particles = [];
    const particleCount = 200;

    function init() {
      for (let i = 0; i < particleCount; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        particles.push(new Particle(x, y));
      }
    }

    // Mouse coordinates
    let mouse = {
      x: null,
      y: null
    };

    // Event listeners for mouse
    window.addEventListener('mousemove', (event) => {
      mouse.x = event.x;
      mouse.y = event.y;
    });

    // Touch points array for multitouch
    let touches = [];

    window.addEventListener('touchstart', (event) => {
      event.preventDefault();
      touches = [];
      for (let i = 0; i < event.touches.length; i++) {
        touches.push({ x: event.touches[i].clientX, y: event.touches[i].clientY });
      }
      if (touches.length === 1) {
        mouse.x = touches[0].x;
        mouse.y = touches[0].y;
      }
    }, { passive: false });

    window.addEventListener('touchmove', (event) => {
      event.preventDefault();
      touches = [];
      for (let i = 0; i < event.touches.length; i++) {
        touches.push({ x: event.touches[i].clientX, y: event.touches[i].clientY });
      }
      if (touches.length === 1) {
        mouse.x = touches[0].x;
        mouse.y = touches[0].y;
      }
    }, { passive: false });

    window.addEventListener('touchend', (event) => {
      if (event.touches.length === 0) {
        mouse.x = null;
        mouse.y = null;
        touches = [];
      } else {
        touches = [];
        for (let i = 0; i < event.touches.length; i++) {
          touches.push({ x: event.touches[i].clientX, y: event.touches[i].clientY });
        }
      }
    });

    // Animation loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(particle => {
        // Apply mouse repulsion
        if (mouse.x !== null) {
          particle.repel(mouse);
        }

        // Apply repulsion for each touch point
        touches.forEach(touch => {
          particle.repel(touch);
        });

        // Return to base and draw
        particle.returnToBase();
        particle.draw();
      });

      requestAnimationFrame(animate);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      init(); // Reinitialize particles on resize
    });

    init();
    animate();

  </script>
</body>
</html>
