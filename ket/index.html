<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Ket" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

    <title>Ketamine Dreams</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/ui.css" />
</head>

<body>
    <div id="splash">
        <div id="splash-player-name" class="splash-ignore-click">
            Welcome back <span id="splash-player-name-text">anon</span>
            <button id="splash-edit-name-btn" class="splash-ignore-click">EDIT</button>
        </div>
        <div id="splash-ring">
            <img src="../web-app-manifest-192x192.png" style="width: 3em; height: auto;" />
        </div>
        <div id="splash-title">KETAMINE DREAMS</div>
        <div class="version">v 0.0.1</div>
        <div id="splash-sub">Dream parsing...</div>
        <div id="splash-progress-track">
            <div id="splash-progress-bar"></div>
        </div>
        <div id="splash-progress-text">LOADING 0%</div>

        <!-- Drone Control Overlays -->
        <div id="controls-panel" style="display: none;">
            <!-- Keyboard: Movement pad -->
            <div class="control-group" id="kb-move">
                <div class="control-label">THRUST / STRAFE</div>
                <div class="control-keys keyboard-grid">
                    <div class="key-cap empty"></div>
                    <div class="key-cap arrow-label">W</div>
                    <div class="key-cap empty"></div>
                    <div class="key-cap arrow-label">A</div>
                    <div class="key-cap arrow-label">S</div>
                    <div class="key-cap arrow-label">D</div>
                    <div class="key-cap empty"></div>
                    <div class="key-cap empty"></div>
                    <div class="key-cap empty"></div>
                </div>
            </div>

            <!-- Keyboard: Altitude -->
            <div class="control-group" id="kb-alt">
                <div class="control-label">ALTITUDE</div>
                <div class="control-keys keyboard-grid">
                    <div class="key-cap empty"></div>
                    <div class="key-cap accent arrow-label">E</div>
                    <div class="key-cap empty"></div>
                    <div class="key-cap empty"></div>
                    <div class="key-cap empty"></div>
                    <div class="key-cap empty"></div>
                    <div class="key-cap empty"></div>
                    <div class="key-cap accent arrow-label">Q</div>
                    <div class="key-cap empty"></div>
                </div>
            </div>

            <!-- Keyboard: Mouse look -->
            <!-- <div class="control-group" id="kb-look">
                <div class="control-label">GYRO AIM</div>
                <div class="mouse-hint">
                    <div class="mouse-icon"></div>
                    <span
                        style="font-family:'Courier New',monospace;font-size:8px;color:rgba(255,255,255,0.25);letter-spacing:0.15em;">MOVE</span>
                </div>
            </div> -->
        </div>
    </div>

    <!-- Touch controls panel (hidden by default, shown for touch devices) -->
    <div id="controls-panel-touch" style="display:none;">
        <div class="control-group">
            <div class="control-label">THRUST / STRAFE</div>
            <div class="joystick-hint">
                <div class="joystick-arrows">
                    <span class="j-up">▲</span>
                    <span class="j-down">▼</span>
                    <span class="j-left">◀</span>
                    <span class="j-right">▶</span>
                </div>
                <div class="joystick-hint-inner"></div>
            </div>
            <div class="joystick-sub-label ">FIRST TOUCH<br>DIRECTION</div>
        </div>

        <div class="control-group right-stick">
            <div class="control-label">YAW / PITCH / ALT</div>
            <div class="joystick-hint right-style">
                <div class="joystick-arrows">
                    <span class="j-up">UP</span>
                    <span class="j-down">DN</span>
                    <span class="j-left">◀</span>
                    <span class="j-right">▶</span>
                </div>
                <div class="joystick-hint-inner right-style"></div>
            </div>
            <div class="joystick-sub-label">SECOND TOUCH<br>ORIENTATION</div>
        </div>
    </div>
    <div id="overlay"></div>

    <!-- Name Edit Modal -->
    <div id="name-modal-overlay">
        <button id="name-modal-close">✕</button>
        <div id="name-modal-title">IDENTITY</div>
        <div id="name-modal-form">
            <input id="name-modal-input" type="text" placeholder="username" maxlength="16" />
            <div id="name-modal-color-label">YOUR COLOR</div>
            <input id="name-modal-color" type="color" value="#00ccff" />
            <button id="name-modal-save">SAVE</button>
        </div>
    </div>
    <!-- <div id="text">
        SYSTEM: KETAMINE DREAMS<br>
        STATUS: <span id="status" style="color:#ff00ff"">RAVE</span>
    </div> -->

    <script>
        if (location.search.includes('debug')) {
            const s = document.createElement('script');
            s.src = './libs/eruda.js';
            s.onload = () => eruda.init();
            document.head.appendChild(s);
        }

        // Player name display and name-edit modal
        (function () {
            const STORAGE_KEY_USERNAME = 'webrtc-username';
            const STORAGE_KEY_COLOR = 'webrtc-user-color';

            function loadUsername() {
                try { return localStorage.getItem(STORAGE_KEY_USERNAME); } catch { return null; }
            }
            function loadUserColor() {
                try { return localStorage.getItem(STORAGE_KEY_COLOR); } catch { return null; }
            }
            function saveUsername(name) {
                try { localStorage.setItem(STORAGE_KEY_USERNAME, name); } catch { }
            }
            function saveUserColor(color) {
                try { localStorage.setItem(STORAGE_KEY_COLOR, color); } catch { }
            }

            let currentName = loadUsername();
            let currentColor = loadUserColor() || '#00ccff';

            const nameTextEl = document.getElementById('splash-player-name-text');
            const nameRowEl = document.getElementById('splash-player-name');
            const modalOverlay = document.getElementById('name-modal-overlay');
            const modalInput = document.getElementById('name-modal-input');
            const modalColor = document.getElementById('name-modal-color');
            const modalSave = document.getElementById('name-modal-save');
            const modalClose = document.getElementById('name-modal-close');
            const isOnline = new URLSearchParams(window.location.search).has('online');

            if (!isOnline) {
                nameRowEl.style.visibility = 'hidden';
            }
            if (nameTextEl && currentName) {
                nameTextEl.textContent = currentName;
                nameTextEl.style.color = currentColor;
            }

            if (nameRowEl) {
                setTimeout(() => { nameRowEl.classList.add('visible'); }, 600);
            }

            const openModal = () => {
                if (modalInput) modalInput.value = currentName || '';
                if (modalColor) modalColor.value = currentColor;
                if (modalOverlay) modalOverlay.classList.add('active');
                if (modalInput) modalInput.focus();
            };
            const closeModal = () => {
                if (modalOverlay) modalOverlay.classList.remove('active');
            };

            const doSave = () => {
                const name = (modalInput && modalInput.value.trim()) || 'anon';
                const color = (modalColor && modalColor.value) || '#00ccff';
                saveUsername(name);
                saveUserColor(color);
                currentName = name;
                currentColor = color;
                if (nameTextEl) {
                    nameTextEl.textContent = name;
                    nameTextEl.style.color = color;
                }
                closeModal();
            };

            // Handle EDIT button directly
            const editBtn = document.getElementById('splash-edit-name-btn');
            if (editBtn) {
                const handleEdit = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    openModal();
                };
                editBtn.addEventListener('click', handleEdit, true);
                editBtn.addEventListener('touchend', handleEdit, { capture: true, passive: false });
            }

            if (modalClose) {
                modalClose.addEventListener('click', closeModal, true);
                modalClose.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); closeModal(); }, { capture: true, passive: false });
            }
            if (modalOverlay) {
                const overlayDismiss = (e) => {
                    if (e.target === modalOverlay) closeModal();
                };
                modalOverlay.addEventListener('click', overlayDismiss, true);
                modalOverlay.addEventListener('touchend', overlayDismiss, { capture: true, passive: false });
            }
            if (modalSave) {
                modalSave.addEventListener('click', doSave, true);
                modalSave.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); doSave(); }, { capture: true, passive: false });
            }
            if (modalInput) {
                modalInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') doSave();
                });
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });
        })();

        // Detect touch capability to show appropriate controls
        (function () {
            const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            const kbPanel = document.getElementById('controls-panel');
            const touchPanel = document.getElementById('controls-panel-touch');

            if (isTouchDevice) {
                kbPanel.style.display = 'none';
                //touchPanel.style.display = 'flex';
                // Move touch panel inside splash for proper stacking
                document.getElementById('splash').appendChild(touchPanel);
                // Apply same bottom positioning
                Object.assign(touchPanel.style, {
                    position: 'fixed',
                    bottom: '0',
                    left: '0',
                    width: '100%',
                    justifyContent: 'center',
                    alignItems: 'flex-end',
                    gap: '0',
                    padding: '0 20px 24px',
                    opacity: '0',
                    transform: 'translateY(30px)',
                    transition: 'opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s',
                    pointerEvents: 'none',
                    zIndex: '100000'
                });
            }

            // Show controls after splash loads
            setTimeout(() => {
                if (isTouchDevice) {
                    touchPanel.style.opacity = '1';
                    touchPanel.style.transform = 'translateY(0)';
                } else {
                    kbPanel.classList.add('visible');
                }
            }, 800);

            // Hide controls when splash exits
            const splashEl = document.getElementById('splash');
            splashEl.addEventListener('click', function hideControls(e) {
                if (e.target.closest('.splash-ignore-click')) return;
                setTimeout(() => {
                    if (isTouchDevice) {
                        touchPanel.style.opacity = '0';
                    } else {
                        kbPanel.classList.remove('visible');
                    }
                }, 100);
                splashEl.removeEventListener('click', hideControls);
            });
        })();
    </script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    <script type="importmap">
            {
            "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
            }
            </script>

    <script type="module" src="index.js">
    </script>
</body>

</html>
