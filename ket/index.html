<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketamine Dreams</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        /* UI Overlay Styling */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, #000 120%);
            z-index: 10;
        }

        #text {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: #fff;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px #fff;
            pointer-events: none;
            z-index: 11;
            opacity: 0.8;
            line-height: 1.4;
        }

        /* lil-gui container styling to make it transparent/darker */
        .lil-gui {
            --background-color: rgba(10, 10, 20, 0.8);
            --text-color: #ddd;
            --title-background-color: #222;
            --widget-color: #444;
            --hover-color: #555;
            --focus-color: #666;
            --number-color: #2cfa98;
            --string-color: #a29bfe;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div id="overlay"></div>
    <div id="text">
        SYSTEM: KETAMINE DREAMS<br>
        STATUS: <span id="status" style="color:#ff00ff"">RAVE</span>
    </div>

    <script type=" importmap">
            {
            "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
            }
            </script>

            <script type="module" src="index.js">
            </script>
</body>

</html>
